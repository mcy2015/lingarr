# This is a development Docker Compose file.
# It is intended for development purposes only and should not be used as a production example.
# Misuse in production environments may lead to unexpected behavior or security risks.

networks:
  lingarr:
    external: true

services:
  Lingarr.Server:
    extra_hosts: # added for ollama 
      - "host.docker.internal:host-gateway"
    container_name: Lingarr.Server
    image: ${DOCKER_REGISTRY-}lingarrserver
    build:
      context: .
      dockerfile: Lingarr.Server/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Debug}
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BASE_PATH=/lingarr
      # Pin the container time zone so .NET stops warning about an unset TZ.
      - TZ=UTC

      # SQLite is the single database engine. Relative paths resolve against
      # /app/config, which is persisted through the config volume below.
      - SQLITE_DB_PATH=lingarr.db
      - DB_HANGFIRE_SQLITE_PATH=/app/config/Hangfire.db

      - SERVICE_TYPE=libretranslate
      - LIBRE_TRANSLATE_URL=http://libretranslate:5000
      - SOURCE_LANGUAGES=[{"name":"English","code":"en"},{"name":"Dutch","code":"nl"}]
      - TARGET_LANGUAGES=[{"name":"Turkish","code":"tr"},{"name":"Dutch","code":"nl"}]
      - LINGARR_ADMIN_USER=admin
      - LINGARR_ADMIN_PASSWORD=admin
      - ASPNETCORE_URLS=http://+:9876
      - ASPNETCORE_HTTP_PORTS=9876
      - PLUGINS_PATH=/app/plugins # Use when plugins exist
    # The runtime image ships bash but neither curl nor wget; /dev/tcp is the
    # zero-dependency way to check that Kestrel is accepting connections.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ../media/data/movies:/movies
      - ../media/data/tv:/tv
      - ../media/data/series/anime:/anime
      - ../media/data/config:/app/config
      - ./samples/CloudflarePlugin/bin/Debug/net10.0:/app/plugins:ro # Mount the plugins
    ports:
      - "9877:9876"
    networks:
      - lingarr
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=lingarr"
      - "traefik.http.services.lingarr.loadbalancer.server.port=9876"
      
      # Prefix /lingarr: http://lingarr.localhost/lingarr
      - "traefik.http.routers.lingarr-pfx.rule=Host(`lingarr.localhost`) && PathPrefix(`/lingarr`)"
      - "traefik.http.routers.lingarr-pfx.entrypoints=web"
      - "traefik.http.routers.lingarr-pfx.service=lingarr"
      - "traefik.http.routers.lingarr-pfx.middlewares=lingarr-prefix"
      - "traefik.http.middlewares.lingarr-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/lingarr"

  Lingarr.Traefik:
    image: traefik:v3
    container_name: Lingarr.Traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lingarr

  Lingarr.Client:
    image: ${DOCKER_REGISTRY-}lingarrclient
    container_name: Lingarr.Client
    build:
      context: ./Lingarr.Client/
      dockerfile: Dockerfile
    ports:
      - "9876:9876"
    volumes:
      - ./Lingarr.Client:/app:rw
      - ./Lingarr.Client/node_modules:/app/node_modules
    tty: true
    command: /bin/sh -c "npm install && npm run dev"
    # The dev server proxies /api and /signalr to Lingarr.Server — wait for it
    # to actually accept connections so cold-start page loads don't hit a
    # proxy error while the Server is still booting.
    depends_on:
      Lingarr.Server:
        condition: service_healthy
    networks:
      - lingarr

