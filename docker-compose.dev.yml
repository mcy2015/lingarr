  radarr:
    image: ghcr.io/hotio/radarr:nightly
    container_name: radarr
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ../media/data/movies:/movies
    restart: unless-stopped
    ports:
      - 7878:7878
    networks:
      - lingarr

  sonarr:
    image: ghcr.io/hotio/sonarr:nightly
    container_name: sonarr
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ../media/data/tv:/tv
      - ../media/data/series/anime:/anime
    restart: unless-stopped
    ports:
      - 8989:8989
    networks:
      - lingarr

