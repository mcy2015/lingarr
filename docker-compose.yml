# ═══ 生产部署(Lingarr fork 单镜像:前端构建产物已打进镜像) ═══
# 首次启动: docker compose up -d,然后开 http://localhost:9878 ——
# 全新库默认启用认证,用 admin/admin 登录后会被强制改密(B 方案安全默认)。
# 数据全部落在 ./data(SQLite + Hangfire 队列),备份该目录即可。
# dev 栈(docker-compose.dev.yml,端口 9876/9877/80)与本栈互不影响。
services:
  lingarr:
    container_name: lingarr
    image: lingarr:latest
    # 镜像不存在时直接从源码构建(平时用: docker build -f Lingarr.Server/Dockerfile -t lingarr:latest .)
    build:
      context: .
      dockerfile: Lingarr.Server/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:9876
      # cron 的解释时区与界面显示时区;与 radarr/sonarr 栈保持一致。
      # 留空/无效会回退 UTC,定时任务页会出警告条提示。
      - TZ=Europe/Amsterdam
      # 首启管理员种子,可省略(缺省 admin/admin,首登强制改密)。
      # - LINGARR_ADMIN_USER=admin
      # - LINGARR_ADMIN_PASSWORD=set-your-own
      # 反代需要子路径时再开(默认根路径直出)。
      # - BASE_PATH=/lingarr
      # 临时排障时提升文件日志级别(Serilog 文件日志落在 ./data/logs):
      # - Serilog__MinimumLevel__Default=Debug
      # Hangfire 任务面板(/hangfire,任务失败+堆栈的第一观测面):
      # 走与 API 相同的 LingarrAccess 认证,这里显式保持默认开启。
      - HANGFIRE_DASHBOARD_ENABLED=true
    volumes:
      # 应用数据:SQLite(lingarr.db)与 Hangfire.db 都在这里
      - ./data:/app/config
      # 媒体目录(必须可写):翻译结果要写回媒体目录(外挂字幕归整/重命名),
      # 只读挂载会导致写回失败;应用内配置媒体源时用容器路径(/movies、/tv)。
      - ../media/data/movies:/movies
      - ../media/data/tv:/tv
      - ../media/data/series/anime:/anime
    ports:
      - "9878:9876"
    # stdout 由 docker json-file 驱动落盘并轮转,防止 NAS 长跑日志无限增长;
    # 与应用自身的 Serilog 文件日志(./data/logs,按天+50MB 滚动)是两个独立通道。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Linux Docker(各类 NAS)默认不解析 host.docker.internal,加这条后
    # 同机服务可统一填 http://host.docker.internal:端口(如 Radarr :7878、
    # Sonarr :8989、LibreTranslate :5001);Docker Desktop 不受影响。
    extra_hosts:
      - "host.docker.internal:host-gateway"
