name: Docker Publish

# Builds and pushes the fork image to GHCR on every push to main —
# NAS/remote hosts then deploy exactly like the upstream model:
# docker compose pull && up. GITHUB_TOKEN carries packages:write,
# no extra secrets needed; the first package lands private by default.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Temporary bisect: real Dockerfile through the same buildx setup,
  # (a) single amd64, (b) multi-platform with QEMU — isolates the trigger.
  diagnose-restore:
    name: Diagnose restore (bisect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: strip host-network from Dockerfile for this bisect
        run: sed -i 's/RUN --network=host /RUN /' Lingarr.Server/Dockerfile
      - name: (a) real Dockerfile, single amd64
        run: docker buildx build --no-cache --progress=plain --platform linux/amd64 -f Lingarr.Server/Dockerfile -t diag:a . 2>&1 | tail -25
      - name: (b) real Dockerfile, multi-platform
        if: always()
        run: docker buildx build --no-cache --progress=plain --platform linux/amd64,linux/arm64 -f Lingarr.Server/Dockerfile -t diag:b . 2>&1 | tail -25

  build-and-push:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Lingarr.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=Release
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
