name: Docker Publish

# Builds and pushes the fork image to GHCR on every push to main —
# NAS/remote hosts then deploy exactly like the upstream model:
# docker compose pull && up. GITHUB_TOKEN carries packages:write,
# no extra secrets needed; the first package lands private by default.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Temporary A/B: the sparse restore the image build performs, run with
  # plain `docker run` instead of through buildx. If this job succeeds
  # while the buildx job fails, the problem is buildx-side.
  diagnose-restore:
    name: Diagnose restore (no buildx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sparse restore in the SDK container
        run: |
          mkdir -p sparse/Lingarr.Contracts sparse/Lingarr.Server sparse/Lingarr.Core sparse/Lingarr.Migrations
          cp Directory.Packages.props global.json sparse/
          cp Lingarr.Contracts/Lingarr.Contracts.csproj sparse/Lingarr.Contracts/
          cp Lingarr.Server/Lingarr.Server.csproj sparse/Lingarr.Server/
          cp Lingarr.Core/Lingarr.Core.csproj sparse/Lingarr.Core/
          cp Lingarr.Migrations/Lingarr.Migrations.csproj sparse/Lingarr.Migrations/
          docker run --rm -v "$PWD/sparse:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0.401 \
            dotnet restore Lingarr.Server/Lingarr.Server.csproj -v d

  build-and-push:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Lingarr.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=Release
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
